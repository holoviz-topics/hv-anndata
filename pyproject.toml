[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-docstring-description", "hatch-vcs", "hatchling" ]

[project]
name = "hv-anndata"
readme = "README.md"
license = "BSD-3-Clause"
authors = [ { name = "Philipp A.", email = "flying-sheep@web.de" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "description", "version" ]
dependencies = [
  "anndata>=0.13",
  "fast-array-utils[accel]",
  "holoviews>=1.23",
  "numpy",
  "pandas",
]
optional-dependencies.panel = [
  "bokeh",
  "datashader",
  "panel",
  "panel-material-ui>=0.4",
  "param",
]

[dependency-groups]
dev = [ { include-group = "test" } ]
test = [
  "nbformat-types",
  "plotly",
  # for VS Code’s coverage function (not needed for `hatch test -c`)
  "pytest-cov",
  "scanpy[scanpy2,scrublet]>=1.13.0a1",
]
docs = [
  "furo",
  "hv-anndata[panel]",
  "ipykernel",
  "ipywidgets",
  "jupyter-bokeh",
  "myst-nb",
  "plotly",
  "pooch",
  "scanpy[scrublet]",
  "scanpydoc",
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-design",
  "sphinx-exec-jupyter[holoviews]",
  "sphinx-issues",
]

[tool.hatch]
version.source = "vcs"
# metadata.hooks.docstring-description = {}  # https://github.com/pypa/hatch/issues/2252
envs.default.python = "3.13"
envs.default.installer = "uv"
envs.default.dependencies = [ "ipykernel" ]
envs.docs.scripts.build = "sphinx-build -b html docs docs/_build/html -W {args}"
envs.docs.scripts.clean = "git clean -fdX -- {args:docs}"
envs.docs.scripts.install-kernel = "python -m ipykernel install --user --name=hv-anndata --display-name=hv-anndata"
envs.docs.scripts.open = "python -m webbrowser {args:docs/_build/html/index.html}"
envs.docs.dependency-groups = [ "docs" ]
envs.hatch-test.matrix = [
  { python = [ "3.14", "3.12" ], feature-set = [ "full" ] },
  { python = [ "3.14" ], feature-set = [ "min", "full" ] },
]
envs.hatch-test.overrides.env.GITHUB_ACTIONS.extra-dependencies = [
  { value = "pytest-github-actions-annotate-failures", if = [ "true" ] },
]
envs.hatch-test.overrides.matrix.feature-set.features = [
  { value = "panel", if = [ "full" ] },
]
envs.hatch-test.dependency-groups = [ "test" ]

[tool.ruff]
format.preview = true
lint.select = [ "ALL" ]
lint.ignore = [
  "cached-instance-method",                    # functools.cache is fine to use
  "docstring-missing-exception",               # No need to document obvious exceptions like TypeError or ValueError
  "incorrect-blank-line-before-class",         # 0 instead of 1 blank lines before class docstring
  "line-contains-todo",                        # TODOs are fine
  "missing-copyright-notice",                  # No copyright notice necessary
  "missing-todo-author",                       # No need to assign TODOs to some person
  "missing-trailing-comma",                    # Incompatible with formatter
  "multi-line-summary-second-line",            # Multi-line docstring summary should start at the first instead of second line
  "pandas-use-of-dot-values",                  # We actually do want `.values` give us a numpy or extension array
  "pytest-fixture-autouse",                    # opinionated
  "single-line-implicit-string-concatenation", # Incompatible with formatter
  "start-process-with-partial-path",           # We don’t run commands with untrusted input
  "subprocess-without-shell-equals-true",      # We don’t want to use `subprocess.run(shell=True)`
  "suspicious-subprocess-import",              # Using the subprocess module is fine
  "undocumented-magic-method",                 # magic methods are usually self-explanatory
  "unnecessary-collection-call",               # dict(...) calls are good
]
lint.per-file-ignores."**/*.ipynb" = [
  "ANN",                     # missing annotations in notebooks are OK
  "D",                       # Missing docstrings in notebooks are OK
  "ERA",                     # commented-out code in notebooks is fine
  "missing-required-import", # Missing `from __future__ import annotations` is fine
  "print",                   # print is fine
]
lint.per-file-ignores."docs/**/*.py" = [
  "implicit-namespace-package", # __init__.py
]
lint.per-file-ignores."scripts/*" = [
  "implicit-namespace-package", # __init__.py
  "print",                      # print is fine
]
lint.per-file-ignores."src/hv_anndata/__main__.py" = [
  "print", # print is fine
]
lint.per-file-ignores."tests/*" = [
  "assert",                        # Use of assert
  "assignment-in-assert",          # assert with := is fine
  "compare-to-empty-string",       # comparing to empty string in tests is clearer
  "D",                             # Missing docstrings in tests are OK
  "implicit-namespace-package",    # __init__.py should not be in tests
  "magic-value-comparison",        # magic-value-comparison
  "SLF",                           # private member access in tests is fine
  "too-many-positional-arguments", # tests and fixures don’t have positional arguments
]
lint.allowed-confusables = [ "×", "’" ]
lint.flake8-type-checking.exempt-modules = []
lint.flake8-type-checking.strict = true
lint.isort.known-first-party = [ "hv_anndata" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pylint.allow-dunder-method-names = [ "__panel__" ]
lint.pylint.max-args = 8
lint.pylint.max-positional-args = 4
lint.pydoclint.ignore-one-line-docstrings = true

[tool.pytest]
addopts = [ "--import-mode=importlib" ]
filterwarnings = [
  "error",
  # add ignore filters here if something fails in 3rd party dependencies
  "ignore:FNV hashing is not implemented in Numba:UserWarning",
]
strict = true
testpaths = [ "src", "tests" ]

[tool.coverage]
run.source_pkgs = [ "hv_anndata", "tests" ]
run.omit = []
run.branch = true
run.parallel = true
paths.session_info2 = [ "src/hv_anndata", "*/hv-anndata/src/hv_anndata" ]
paths.tests = [ "tests", "*/hv-anndata/tests" ]
report.exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pytest\\.fail(.*)",
]
